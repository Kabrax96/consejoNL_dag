name: Serverless Prod Deployment
on:
  push:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.ref }}/deploy
  cancel-in-progress: true

env:
  DAGSTER_CLOUD_URL: "https://connl.dagster.cloud"
  DAGSTER_CLOUD_API_TOKEN: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
  ENABLE_FAST_DEPLOYS: "true"
  PYTHON_VERSION: "3.11"
  DAGSTER_CLOUD_FILE: "consejonl_fag/dagster_cloud.yaml"

jobs:
  dagster_cloud_default_deploy:
    name: Dagster Serverless Deploy
    runs-on: ubuntu-22.04
    outputs:
      build_info: ${{ steps.parse-workspace.outputs.build_info }}

    steps:
      - name: Prerun Checks
        id: prerun
        uses: dagster-io/dagster-cloud-action/actions/utils/prerun@v0.1

      - name: Launch Docker Deploy
        if: steps.prerun.outputs.result == 'docker-deploy'
        id: parse-workspace
        uses: dagster-io/dagster-cloud-action/actions/utils/parse_workspace@v0.1
        with:
          dagster_cloud_file: ${{ env.DAGSTER_CLOUD_FILE }}

      - name: Checkout repo (exact commit)
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify build config & files
        if: steps.prerun.outputs.result == 'pex-deploy'
        run: |
          set -euo pipefail
          echo "=== dagster_cloud.yaml ==="
          cat consejonl_fag/dagster_cloud.yaml
          echo "=== repo root tree ==="
          ls -la
          echo "=== requirements at repo root ==="
          test -f requirements.txt || { echo "ERROR: falta requirements.txt en la raíz"; exit 1; }
          cat requirements.txt
          echo "=== list consejonl_fag ==="
          ls -la consejonl_fag

      - name: Install Python deps for dbt parse
        if: steps.prerun.outputs.result == 'pex-deploy'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dbt manifest (parse)
        if: steps.prerun.outputs.result == 'pex-deploy'
        working-directory: ${{ github.workspace }}
        env:
          DBT_TARGET: ${{ secrets.DBT_TARGET }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA_DEV: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from dagster_dbt import DbtCliResource

          root = Path(".").resolve()
          project_dir = root / "consejonl_fag" / "dbt" / "consejonl"
          profiles_dir = root / "consejonl_fag" / "dbt" / "profiles_dagster"

          assert project_dir.exists(), f"missing {project_dir}"
          assert profiles_dir.exists(), f"missing {profiles_dir}"

          dbt = DbtCliResource(
              project_dir=str(project_dir),
              profiles_dir=str(profiles_dir),
              target=os.getenv("DBT_TARGET", "prod"),
          )

          # En dagster-dbt 0.27.x: wait() lanza excepción si falla; no usa .success
          dbt.cli(["parse"]).wait()

          target_dir = project_dir / "target"
          manifests = list(target_dir.rglob("manifest.json"))
          if manifests:
              print("OK: manifest.json at", manifests[0])
          else:
              print(f"NOTE: no manifest.json found under {target_dir}; dbt 1.10 usa subcarpetas con hash. Dagster parseará en runtime.")
          PY

      - name: Smoke test: module has defs (Dagster)
        if: steps.prerun.outputs.result == 'pex-deploy'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== quick tree (repo root) ==="
          ls -la
          echo "=== consejonl_fag/ tree ==="
          ls -la consejonl_fag || true
          echo "=== head of consejonl_fag/definitions.py ==="
          sed -n '1,120p' consejonl_fag/definitions.py || true

          python - <<'PY'
          import sys, importlib, traceback
          print("Python:", sys.version)
          try:
              m = importlib.import_module("consejonl_fag.definitions")
              defs = getattr(m, "defs", None)
              assert defs is not None, "definitions.defs no encontrado"
              try:
                  from dagster import Definitions
                  assert isinstance(defs, Definitions), f"defs no es Definitions, es {type(defs)}"
              except Exception as type_check_err:
                  print("Aviso: no pude validar el tipo con dagster; continúo porque 'defs' existe.", type_check_err)
              print("OK: defs presente y accesible en consejonl_fag.definitions")
          except Exception:
              print("FALLO smoke test de defs:\n")
              traceback.print_exc()
              raise SystemExit(1)
          PY

      - name: Python Executable Deploy
        if: steps.prerun.outputs.result == 'pex-deploy'
        uses: dagster-io/dagster-cloud-action/actions/build_deploy_python_executable@v0.1
        with:
          dagster_cloud_file: "$GITHUB_WORKSPACE/${{ env.DAGSTER_CLOUD_FILE }}"
          build_output_dir: "$GITHUB_WORKSPACE/build"
          python_version: "${{ env.PYTHON_VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dagster_cloud_docker_deploy:
    name: Docker Deploy
    runs-on: ubuntu-20.04
    if: needs.dagster_cloud_default_deploy.outputs.build_info
    needs: dagster_cloud_default_deploy
    strategy:
      fail-fast: false
      matrix:
        location: ${{ fromJSON(needs.dagster_cloud_default_deploy.outputs.build_info) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build and deploy to Dagster Cloud serverless
        uses: dagster-io/dagster-cloud-action/actions/serverless_prod_deploy@v0.1
        with:
          dagster_cloud_api_token: ${{ secrets.DAGSTER_CLOUD_API_TOKEN }}
          location: ${{ toJson(matrix.location) }}
          base_image: "python:${{ env.PYTHON_VERSION }}-slim"
          organization_id: ${{ secrets.ORGANIZATION_ID }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
