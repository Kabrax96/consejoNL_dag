[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consejonl-fag"
version = "0.1.0"
description = "Dagster project for Consejo NL pipelines"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Tu Nombre", email = "tu.email@example.com" }
]
license = { text = "Proprietary" }


dependencies = [
  "dagster==1.11.5",
  "dagster-cloud==1.11.5",
  "dagster-dbt==0.27.5",
  "dbt-core==1.10.6",
  "dbt-snowflake==1.10.0",
  "snowflake-connector-python==3.16.0",
  "networkx==3.4.2; python_version < '3.11'",
  "networkx==3.5; python_version >= '3.11'",
]


classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["consejonl_fag*"]
