[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "consejonl-fag"
version = "0.1.0"
description = "Dagster project for Consejo NL pipelines"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "dagster==1.11.5",
  "dagster-cloud==1.11.5",

  # keep a minimal set first; add more later once deploy is green
  "dbt-core==1.10.6",
  "dbt-snowflake==1.10.0",
  "snowflake-connector-python==3.16.0",
  "networkx==3.4.2"
]
